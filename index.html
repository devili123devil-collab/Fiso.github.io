<!DOCTYPE html>
<html>
<head>
    <title>ჩემი კატები</title>
</head>

<body>
    <h1>გამარჯობა, ფისო 🐈‍⬛🐈</h1>

    <p id="text">დააჭირე ღილაკს თუ გიყვარს კატები.</p>

    <button onclick="changeText()">მიაუუუუუუუუუუ🐈‍⬛🐈</button>

    <script>
        function changeText() {
            document.getElementById("text").innerText =
                "რატომ დააჭირე 😭 ახლა აჭამე 🍗.";
        }
    </script>
</body>
</html>
