```html
<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>Fiso 🐈</title>

    <style>
        body {
            margin: 0;
            text-align: center;
            font-family: Arial, sans-serif;
            background: pink;
            padding-bottom: 100px;
        }

        h1 {
            font-size: 100px;
            margin-top: 90px;
        }

        p {
            font-size: 25px;
            font-weight: bold;
        }

        .cats {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            padding: 30px;
        }

        .cat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .cats img {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 25px;
            border: 5px solid white;
            cursor: pointer;
            transition: 0.3s;
        }

        .cats img:hover {
            transform: scale(1.08) rotate(2deg);
        }

        button {
            font-size: 22px;
            padding: 15px 30px;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            margin-top: 20px;
        }

        .vote-count {
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
        }

        #results {
            margin-top: 40px;
            font-size: 25px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>🐱 ტკბილეულის ქარხანა 🐱</h1>

    <p id="text">რომელი კატის არომატია თქვენთვის ფავორიტი? 🐈</p>

    <div class="cats">

        <div class="cat-box">
            <img src="1000003483.jpg" onclick="selectCat(1)">
            <div class="vote-count" id="count1">ფისო №1 — 0 ხმა</div>
        </div>

        <div class="cat-box">
            <img src="1000004685.jpg" onclick="selectCat(2)">
            <div class="vote-count" id="count2">ფისო №2 — 0 ხმა</div>
        </div>

        <div class="cat-box">
            <img src="1000015855.jpg" onclick="selectCat(3)">
            <div class="vote-count" id="count3">ფისო №3 — 0 ხმა</div>
        </div>

        <div class="cat-box">
            <img src="1000019381.jpg" onclick="selectCat(4)">
            <div class="vote-count" id="count4">ფისო №4 — 0 ხმა</div>
        </div>

    </div>

    <button onclick="vote()">🗳️ ხმა მიეცით</button>

    <div id="results">
        📊 შედეგები გამოჩნდება აქ
    </div>

    <script>

        let selectedCat = 0;

        let votes = JSON.parse(localStorage.getItem("catVotes")) || {
            1: 0,
            2: 0,
            3: 0,
            4: 0
        };

        function selectCat(cat) {

            selectedCat = cat;

            document.getElementById("text").innerHTML =
                "თქვენ აირჩიეთ ფისო №" + cat + " 🐈";

        }

        function vote() {

            if (selectedCat === 0) {

                document.getElementById("text").innerHTML =
                    "ჯერ აირჩიეთ ფისო 😹";

                return;
            }

            votes[selectedCat]++;

            localStorage.setItem("catVotes", JSON.stringify(votes));

            updateResults();

            document.getElementById("text").innerHTML =
                "მიაუ! თქვენი ხმა ჩაითვალა! 🩷🩵";
        }

        function updateResults() {

            document.getElementById("count1").innerHTML =
                "ფისო №1 — " + votes[1] + " ხმა";

            document.getElementById("count2").innerHTML =
                "ფისო №2 — " + votes[2] + " ხმა";

            document.getElementById("count3").innerHTML =
                "ფისო №3 — " + votes[3] + " ხმა";

            document.getElementById("count4").innerHTML =
                "ფისო №4 — " + votes[4] + " ხმა";

        }

        updateResults();

    </script>

</body>
</html>
